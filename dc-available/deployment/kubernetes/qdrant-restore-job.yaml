# =============================================================================
# qdrant-restore-job.yaml  —  one-off restore of the two local snapshots into
# the in-cluster Qdrant.
#
# It mounts the available-data PVC (where upload_to_share.ps1 put the .snapshot
# files under _snapshots/) and POSTs each to Qdrant's snapshot-upload API. The
# collection name in the URL is the TARGET name, so the snapshot data lands in
# 'available2.0' and 'available_entities' (created if absent).
#
# Apply:  az aks command invoke ... --command "kubectl apply -f qdrant-restore-job.yaml" --file qdrant-restore-job.yaml
# Logs:   kubectl logs -n available-2 job/qdrant-restore
# Delete after success: kubectl delete job qdrant-restore -n available-2
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: qdrant-restore
  namespace: available-2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "== restoring available2.0 =="
              curl -sS --fail-with-body -X POST \
                "http://qdrant:6333/collections/available2.0/snapshots/upload?priority=snapshot" \
                -F "snapshot=@/data/_snapshots/available2.0.snapshot"
              echo
              echo "== restoring available_entities =="
              curl -sS --fail-with-body -X POST \
                "http://qdrant:6333/collections/available_entities/snapshots/upload?priority=snapshot" \
                -F "snapshot=@/data/_snapshots/available_entities.snapshot"
              echo
              echo "== resulting collections =="
              curl -sS "http://qdrant:6333/collections"
              echo
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: available-data
