[tool.poetry]
name = "dc-available"
version = "0.8.0"
description = "DC AVAILABLE is your new learning helper."
authors = ["Lukas Lange <Lukas.Lange@de.bosch.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
torch = "^2.2.0"
transformers = "^4.37.2"
langchain = "^0.1.14"
langchain-core = ">=0.1.53"
langchain-openai = "^0.1.1"
langchain-community = "^0.0.31"
langchain-qdrant = ">=0.1.0"
faiss-cpu = "^1.7.4"
# Updated to >=1.10.0 for hybrid search support (sparse + dense vectors)
qdrant-client = ">=1.10.0"
openai = "^1.12.0"
streamlit = "^1.30.0"
flagembedding = "^1.2.3"
pyautogen = ">=0.5.3,<0.6.0"
shortuuid = { version = "^1.0.11", optional = true }
pydantic = ">=1.10,<3"
openpyxl = { version = "^3.1.2", optional = true }
comtypes = "^1.3.0"
pymupdf = "^1.23.24"
azure-identity = "^1.15.0"
scikit-image = "^0.22.0"
opencv-python-headless = "^4.9.0.80"
chardet = "^5.2.0"
extract-msg = "^0.48.5"
python-pptx = "^0.6.23"
pypdf2 = "^3.0.1"
streamlit-navigation-bar = "^3.3.0"
streamlit-extras = "^0.4.7"
pillow = "^10.2.0"            # For PIL.Image in display_file function
uuid = "^1.30"                # For generating UUIDs in document upload
requests = "^2.31.0"          # For Teams webhook notifications
pyvis = "^0.3.2"              # Interactive graph visualization
#torchvision = "^0.17.0"
sentence-transformers = "^3.4.1"
chromadb = "^0.6.3"
markdownify = "^1.0.0"
langdetect = "^1.0.9"
pypdf = "^6.11.0"
ragas = ">=0.1,<0.2"
datasets = ">=2.18,<3"
opik = "^2.0.60"




[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"
bump2version = "^1.0.1"
mkdocs-material = "^9.5.8"
pytest = "^8.0.0"
pytest-timeout = "^2.2.0"
isort = "^5.13.2"
pytest-html = "^4.1.1"
ipdb = "^0.13"
ipykernel = "^7.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
